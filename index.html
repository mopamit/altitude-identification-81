<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>זיהוי גובה במשולש</title><style>
@font-face{font-family:SimplerPro;src:url('assets/fonts/SimplerPro-Regular.woff2')}@font-face{font-family:SimplerPro;src:url('assets/fonts/SimplerPro-Semibold.woff2');font-weight:600}@font-face{font-family:SimplerPro;src:url('assets/fonts/SimplerPro-Bold.woff2');font-weight:700}
:root{--blue:#17365e;--green:#6db580;--burg:#832058;--red:#c94747;--line:#74869a;--bg:#faf9f5;--border:#e8e4dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:SimplerPro,Arial;color:var(--blue);padding:18px}.app{max-width:1200px;margin:auto}.top{display:grid;grid-template-columns:180px 1fr 180px;direction:ltr;align-items:center;min-height:68px;margin-bottom:16px}.logo{height:44px;justify-self:start}.title{direction:rtl;text-align:center;color:var(--burg);font-size:31px;font-weight:700}.reset{justify-self:end;border:1px solid #d7dde2;background:#fff;color:var(--blue);padding:10px 20px;border-radius:12px;font:600 16px SimplerPro;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;direction:ltr}.card{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 3px 14px #17365e0f}.board{padding:14px;min-height:620px;position:relative}.panel{padding:25px 23px;direction:rtl}.panel h2{margin:0 0 12px;color:var(--burg);font-size:28px}.panel p{color:var(--burg);font-size:18px;line-height:1.55;margin:0 0 18px}.task{background:#f8faf7;border:1px solid #dfe8df;border-radius:15px;padding:15px 16px;font-size:19px;line-height:1.5;margin-bottom:14px}.task b{color:var(--burg)}.progress{font-size:16px;font-weight:600;margin-bottom:10px}.bar{height:8px;background:#eef1f2;border-radius:10px;overflow:hidden;margin-bottom:18px}.bar>i{display:block;height:100%;background:var(--green);width:0}.feedback{min-height:70px;border-radius:14px;padding:13px 15px;font-size:17px;line-height:1.45;background:#f7f8fa;border:1px solid #e0e5e8}.feedback.good{background:#f2faf4;border-color:#b9ddc2;color:#285d36}.feedback.bad{background:#fff6f6;border-color:#efc3c3;color:#8c3030}.next{width:100%;margin-top:12px;border:0;background:var(--blue);color:#fff;border-radius:12px;padding:12px;font:600 17px SimplerPro;cursor:pointer;display:none}.hint{margin-top:18px;font-size:15px;line-height:1.5;color:#657486}.hint strong{color:var(--blue)}svg{width:100%;height:580px;display:block;overflow:visible}.tri{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linejoin:round}.extension{stroke:var(--line);stroke-width:2;stroke-dasharray:7 7;opacity:.55}.candidate{stroke-width:5;stroke-linecap:round;cursor:pointer;transition:.15s}.candidate:hover{stroke-width:7;filter:brightness(.88)}.candidate.wrong{stroke:var(--red)!important}.candidate.correct{stroke:var(--green)!important;stroke-width:7}.hitline{stroke:transparent;stroke-width:22;cursor:pointer}.endpoint{stroke:#fff;stroke-width:2}.vertex{fill:#fff;stroke:var(--burg);stroke-width:3}.vlab{font-size:19px;font-weight:700;fill:var(--blue);text-anchor:middle}.rightMark{fill:none;stroke:var(--burg);stroke-width:2.5}.foot{fill:var(--green)}
@media(max-width:820px){body{padding:10px}.top{grid-template-columns:100px 1fr 100px}.logo{height:32px}.title{font-size:23px}.reset{font-size:14px;padding:8px 10px}.layout{display:flex;flex-direction:column}.board{order:1;min-height:0}.panel{order:2}.panel h2{font-size:24px}svg{height:auto;aspect-ratio:7/5}}
</style></head><body><div class="app"><header class="top"><img class="logo" src="assets/prisming-logo.png"><div class="title">יישומון זיהוי גובה במשולש</div><button class="reset" id="reset">התחלה מחדש</button></header><main class="layout"><section class="card board"><svg id="svg" viewBox="0 0 760 560" aria-label="תרגיל זיהוי גובה"></svg></section><aside class="card panel"><h2>איזה קו הוא הגובה?</h2><p>בכל שרטוט מופיעים כמה קווים אפשריים. לחצו על הקו שהוא <b>הגובה</b> המבוקש.</p><div class="progress" id="progress"></div><div class="bar"><i id="bar"></i></div><div class="task" id="task"></div><div class="feedback" id="feedback">זכרו: גובה יוצא מקודקוד ומאונך לצלע שמולו או להמשכה.</div><button class="next" id="next">לתרגיל הבא</button><div class="hint"><strong>שימו לב:</strong> לפעמים הגובה נמצא בתוך המשולש, לפעמים מחוץ לו, ובמשולש ישר־זווית אחת מצלעות המשולש יכולה להיות הגובה.</div></aside></main></div><script>
const svg=document.getElementById('svg'), taskEl=document.getElementById('task'),fb=document.getElementById('feedback'),next=document.getElementById('next'),prog=document.getElementById('progress'),bar=document.getElementById('bar');
const NS='http://www.w3.org/2000/svg'; const V={A:'A',B:'B',C:'C'};
// מאגר התרגילים נבנה מ-50 תצורות שונות של משולשים.
// בכל הפעלה נבחרים 10 תרגילים בתמהיל קבוע של רמות קושי.
const COLORS=['#2f80c0','#e39a35','#8b5fbf','#2a9d8f','#d95f59'];

function seededRandom(seed){let x=Math.sin(seed*999.91)*43758.5453;return x-Math.floor(x)}
function rotatePoint(p,c,a){let s=Math.sin(a),co=Math.cos(a),x=p.x-c.x,y=p.y-c.y;return{x:c.x+x*co-y*s,y:c.y+x*s+y*co}}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function add(a,b){return{x:a.x+b.x,y:a.y+b.y}}
function sub(a,b){return{x:a.x-b.x,y:a.y-b.y}}
function mul(a,k){return{x:a.x*k,y:a.y*k}}
function dot(a,b){return a.x*b.x+a.y*b.y}
function len(a){return Math.hypot(a.x,a.y)}
function unit(a){let L=len(a)||1;return{x:a.x/L,y:a.y/L}}
function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function project(p,a,b){let ab=sub(b,a),den=dot(ab,ab)||1,t=dot(sub(p,a),ab)/den;return{p:add(a,mul(ab,t)),t}}
function bisectorFoot(v,a,b){let va=len(sub(a,v)),vb=len(sub(b,v)),den=va+vb||1;return{x:(vb*a.x+va*b.x)/den,y:(vb*a.y+va*b.y)/den}}
function el(tag,attrs={}){let n=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
function makeTemplate(seed,type){
  // בסיסים שונים לפי סוג, ולאחר מכן שינוי גודל/הטיה דטרמיניסטיים.
  let bases={
    acute:{A:{x:150,y:430},B:{x:610,y:430},C:{x:350,y:120}},
    acute2:{A:{x:155,y:440},B:{x:610,y:395},C:{x:305,y:105}},
    obtuseL:{A:{x:170,y:430},B:{x:600,y:420},C:{x:80,y:145}},
    obtuseR:{A:{x:160,y:430},B:{x:590,y:425},C:{x:685,y:155}},
    rightL:{A:{x:175,y:430},B:{x:610,y:430},C:{x:175,y:120}},
    rightR:{A:{x:155,y:430},B:{x:590,y:430},C:{x:590,y:135}},
    skinny:{A:{x:145,y:440},B:{x:620,y:430},C:{x:500,y:105}}
  };
  let b=bases[type],P={A:{...b.A},B:{...b.B},C:{...b.C}};
  let cx=(P.A.x+P.B.x+P.C.x)/3,cy=(P.A.y+P.B.y+P.C.y)/3,c={x:cx,y:cy};
  let sx=.88+seededRandom(seed+1)*.18,sy=.88+seededRandom(seed+2)*.16;
  for(let k of ['A','B','C']){P[k].x=cx+(P[k].x-cx)*sx;P[k].y=cy+(P[k].y-cy)*sy}
  let ang=(seededRandom(seed+3)-.5)*.18;
  for(let k of ['A','B','C'])P[k]=rotatePoint(P[k],c,ang);
  // הזזה קלה, תוך שמירה על מרווחים מהשוליים.
  let dx=(seededRandom(seed+4)-.5)*45,dy=(seededRandom(seed+5)-.5)*25;
  for(let k of ['A','B','C']){P[k].x=clamp(P[k].x+dx,75,690);P[k].y=clamp(P[k].y+dy,70,490)}
  return P;
}

function classifyQuestion(P,v){let [u,w]=opposite(v),O=project(P[v],P[u],P[w]);let side1=sub(P[u],P[v]),side2=sub(P[w],P[v]);let cos=dot(side1,side2)/(len(side1)*len(side2));let angle=Math.acos(clamp(cos,-1,1))*180/Math.PI;
  if(O.t<-.02||O.t>1.02)return 'external';
  if(Math.abs(angle-90)<2.5)return 'sideAltitude';
  return 'internal';
}

function buildQuestionPool(){
  const specs=[];
  // 50 תצורות שונות: 22 חדות/כלליות, 16 קהות, 8 ישרות, 4 צרות/מוטות.
  for(let i=0;i<22;i++)specs.push({type:i%2?'acute':'acute2',seed:100+i});
  for(let i=0;i<8;i++)specs.push({type:'obtuseL',seed:200+i});
  for(let i=0;i<8;i++)specs.push({type:'obtuseR',seed:220+i});
  for(let i=0;i<4;i++)specs.push({type:'rightL',seed:300+i});
  for(let i=0;i<4;i++)specs.push({type:'rightR',seed:320+i});
  for(let i=0;i<4;i++)specs.push({type:'skinny',seed:400+i});
  let pool=[];
  specs.forEach((sp,ti)=>{
    let P=makeTemplate(sp.seed,sp.type);
    ['A','B','C'].forEach(v=>{
      let [u,w]=opposite(v),O=project(P[v],P[u],P[w]).p,M=midpoint(P[u],P[w]),D=bisectorFoot(P[v],P[u],P[w]);
      let sep=Math.min(len(sub(O,M)),len(sub(O,D)));
      let kind=classifyQuestion(P,v);
      // שאלות שבהן המסיחים כמעט מתלכדים אינן מתאימות לזיהוי חזותי.
      if(sep>28 || kind==='sideAltitude')pool.push({P,v,kind,templateId:ti});
    });
  });
  return pool;
}
const QUESTION_POOL=buildQuestionPool();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function takeUnique(arr,n,used){let out=[];for(let q of shuffle(arr)){if(used.has(q.templateId))continue;used.add(q.templateId);out.push(q);if(out.length===n)break}return out}
function makeBank(){
  // 10 תרגילים: 4 בסיסיים פנימיים, 3 בינוניים, 2 חיצוניים, 1 מקרה שבו צלע היא גובה.
  // אם קטגוריה חסרה מסיבה גאומטרית, משלימים מהמאגר בלי לחזור על אותו משולש.
  let used=new Set(),result=[];
  let internal=QUESTION_POOL.filter(q=>q.kind==='internal');
  let external=QUESTION_POOL.filter(q=>q.kind==='external');
  let side=QUESTION_POOL.filter(q=>q.kind==='sideAltitude');
  result.push(...takeUnique(internal,7,used));
  result.push(...takeUnique(external,2,used));
  result.push(...takeUnique(side,1,used));
  if(result.length<10)result.push(...takeUnique(QUESTION_POOL,10-result.length,used));
  // שומרים התקדמות: תחילה 4 פנימיים פשוטים; היתר מעורבבים כרמות בינוני/אתגר.
  let first=result.filter(q=>q.kind==='internal').slice(0,4);
  let rest=result.filter(q=>!first.includes(q));
  return [...first,...shuffle(rest)].slice(0,10);
}
function opposite(v){return v==='A'?['B','C']:v==='B'?['A','C']:['A','B']}
function render(){locked=false;next.style.display='none';fb.className='feedback';fb.textContent='בחרו את הקו המתאים. אפשר לנסות שוב אם טעיתם.';svg.innerHTML='';let q=questions[idx],P=q.P,v=q.v,[u,w]=opposite(v),O=project(P[v],P[u],P[w]),M=midpoint(P[u],P[w]),D=bisectorFoot(P[v],P[u],P[w]);
 taskEl.innerHTML=`בחרו את <b>הגובה היוצא מהקודקוד <span dir="ltr">${v}</span></b><br>אל הצלע <b><span dir="ltr">${u}${w}</span></b> או אל המשכה.`;let level=idx<4?'בסיס':idx<8?'בינוני':'אתגר';prog.textContent=`תרגיל ${idx+1} מתוך ${questions.length} · רמת ${level}`;bar.style.width=`${idx/questions.length*100}%`;
 // extension if needed
 if(O.t<0||O.t>1){let d=unit(sub(P[w],P[u])),a=add(P[u],mul(d,-150)),b=add(P[w],mul(d,150));svg.append(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'extension'}))}
 svg.append(el('polygon',{points:`${P.A.x},${P.A.y} ${P.B.x},${P.B.y} ${P.C.x},${P.C.y}`,class:'tri'}));
 // קווים אפשריים: מרווחים זה מזה וללא מספרים שמסתירים את השרטוט
 let dvec=sub(P[w],P[u]);
 let cand=[{p:O.p,correct:true},{p:M,correct:false},{p:D,correct:false}];
 // אם מסיח קרוב מדי לגובה, מחליפים אותו בנקודה רחוקה יותר על הצלע שמנגד
 const fallback=[.18,.38,.62,.82].map(t=>add(P[u],mul(dvec,t)));
 let out=[];
 for(let c of cand){
   if(out.some(z=>len(sub(z.p,c.p))<42) || (!c.correct&&len(sub(c.p,O.p))<42)){
     let rp=fallback.find(fp=>len(sub(fp,O.p))>55&&!out.some(z=>len(sub(z.p,fp))<55));
     if(rp)c={p:rp,correct:false}; else continue;
   }
   out.push(c);
 }
 while(out.length<4){let rp=fallback.find(fp=>len(sub(fp,O.p))>55&&!out.some(z=>len(sub(z.p,fp))<55));if(!rp)break;out.push({p:rp,correct:false})}
 out=out.sort(()=>Math.random()-.5);
 const colors=['#2f80c0','#e39a35','#8b5fbf','#2a9d8f'];
 out.forEach((c,i)=>{let g=el('g');let col=colors[i%colors.length];let l=el('line',{x1:P[v].x,y1:P[v].y,x2:c.p.x,y2:c.p.y,class:'candidate','data-correct':c.correct?'1':'0',stroke:col});let hit=el('line',{x1:P[v].x,y1:P[v].y,x2:c.p.x,y2:c.p.y,class:'hitline'});let ep=el('circle',{cx:c.p.x,cy:c.p.y,r:6,class:'endpoint',fill:col});g.append(l,hit,ep);g.addEventListener('click',()=>choose(g,c,O,P,u,w,v));svg.append(g)});
 ['A','B','C'].forEach(k=>{svg.append(el('circle',{cx:P[k].x,cy:P[k].y,r:8,class:'vertex'}));let off=k==='C'?[0,-20]:k==='A'?[-14,-12]:[14,-12];let t=el('text',{x:P[k].x+off[0],y:P[k].y+off[1],class:'vlab'});t.textContent=k;svg.append(t)})
}
function choose(g,c,O,P,u,w,v){if(locked)return;let line=g.querySelector('.candidate');if(!c.correct){line.classList.add('wrong');fb.className='feedback bad';fb.textContent='זה אינו הגובה המבוקש. בדקו: האם הקו יוצא מהקודקוד המבוקש והאם הוא מאונך לצלע שמולו?';setTimeout(()=>line.classList.remove('wrong'),700);return}locked=true;score++;line.classList.add('correct');fb.className='feedback good';fb.textContent='נכון! הקו יוצא מהקודקוד המבוקש ומאונך לצלע שמולו או להמשכה.';drawRight(O.p,P[v],P[u],P[w]);svg.append(el('circle',{cx:O.p.x,cy:O.p.y,r:5,class:'foot'}));next.style.display='block';bar.style.width=`${(idx+1)/questions.length*100}%`}
function drawRight(F,P,U,W){let a=unit(sub(P,F)),b=unit(sub(W,U));if(dot(a,b)>0)b=mul(b,-1);let s=15,p1=add(F,mul(a,s)),p2=add(p1,mul(b,s)),p3=add(F,mul(b,s));svg.append(el('path',{d:`M ${F.x} ${F.y} L ${p1.x} ${p1.y} L ${p2.x} ${p2.y} L ${p3.x} ${p3.y}`,class:'rightMark'}))}
next.onclick=()=>{if(idx<questions.length-1){idx++;render()}else{taskEl.innerHTML='<b>סיימתם את התרגול!</b>';fb.className='feedback good';fb.textContent=`כל הכבוד. זיהיתם ${score} גבהים נכונים מתוך ${questions.length} תרגילים.`;next.style.display='none';bar.style.width='100%';svg.innerHTML=''}};document.getElementById('reset').onclick=start;function start(){questions=makeBank();idx=0;score=0;render()}start();
</script></body></html>
